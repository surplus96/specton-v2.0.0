name: Task
description: 구현 목적, 선행 작업, 검증 가능한 완료 조건을 기록한다
body:
  - type: input
    id: refs
    attributes:
      label: 관련 항목 / References
      description: 저장소 안에서 찾을 수 있는 근거만 적는다 (요구사항·docs 문서·TC·ADR)
      placeholder: REQ-04, docs/ko/architecture.md, TC-A01, ADR-0008
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 할 일 / Goal
      description: 체크리스트로 적는다. 무엇을 만들고 무엇은 범위 밖인지
      placeholder: "- [ ] A01 노드 어댑터\n- [ ] 고정 응답 테스트 3종"
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건 / Acceptance criteria
      description: 확인 가능한 결과 (테스트, 화면, 산출물)
      placeholder: "- 관련 TC 통과 (결과를 PR 본문에 기재)"
    validations:
      required: true
  - type: textarea
    id: blockers
    attributes:
      label: 선행 작업·막힌 이유 / Dependencies
      description: 먼저 끝나야 하는 이슈(#번호)와 기다려야 하는 이유, 기다리는 동안 먼저 할 수 있는 것, 필요한 결정(ADR)
