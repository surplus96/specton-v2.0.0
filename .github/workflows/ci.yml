name: ci

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Verify deterministic baseline
        run: uv run python -m specton.evaluation.baseline --repeats 1
      # 한글 엔진 시험 (ADR-0004): rhwp-python 0.8.1 리눅스 휠은 묶어 둔 libfreetype에 함수가 빠져
      # `import rhwp`가 실패한다(상류 DanMeon/rhwp-python #31). 위 단계에서는 엔진 시험이 건너뛰어지므로,
      # 시스템 libfreetype을 먼저 불러온 채 다시 돌리고, 엔진을 못 불러와 건너뛰는 것은 실패로 둔다
      # (비공개 원문 시험 3개는 그대로 건너뜀). 상류가 고쳐지면 지운다.
      - name: hangul engine tests
        env:
          FREETYPE: /usr/lib/x86_64-linux-gnu/libfreetype.so.6
          SPECTON_REQUIRE_ENGINE: "1"
        run: |
          test -f "$FREETYPE" || { echo "시스템 libfreetype이 없음: $FREETYPE"; exit 1; }
          LD_PRELOAD="$FREETYPE" uv run pytest -rs tests/unit/test_ingest_hangul.py tests/unit/test_hangul_engine_lazy_import.py tests/unit/test_hangul_input.py
      - run: uv run python -m specton.packs.build --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-baseline
          path: var/baseline/report.json

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: specton
          POSTGRES_PASSWORD: specton
          POSTGRES_DB: specton_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U specton -d specton_app"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SPECTON_APP_DATABASE_URL: postgresql://specton:specton@127.0.0.1:5432/specton_app
      SPECTON_SANDBOX_DATABASE_URL: postgresql://specton_sandbox:specton_sandbox@127.0.0.1:5432/specton_sandbox
      SPECTON_TEST_SOURCE_OUTPUT: /tmp/specton-generated-source.zip
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Create isolated SQL validation database
        run: >-
          docker exec -i -e SANDBOX_PASSWORD=specton_sandbox
          "${{ job.services.postgres.id }}" bash < docker/postgres/init/01_sandbox.sh
      - run: uv run python -m specton.persistence.migrate upgrade
      - run: uv run python -m specton.persistence.migrate check
      - name: Database and API regression
        run: uv run pytest --require-db -m 'db and not native_pdf and not llm' --junitxml=var/test-results/database.xml
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build the application produced by the approved-spec API test
        run: |
          uv run python - <<'PY'
          import hashlib
          from pathlib import Path
          from specton.implementation.verify import inspect_package
          source = Path("/tmp/specton-generated-source.zip").read_bytes()
          files, _ = inspect_package(source, hashlib.sha256(source).hexdigest())
          for name, content in files.items():
              if name.startswith("frontend/"):
                  target = Path("var/generated-web") / name.removeprefix("frontend/")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(content)
          PY
          npm --prefix var/generated-web ci --no-audit --no-fund
          npm --prefix var/generated-web run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-test-results
          path: var/test-results/database.xml

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:api
      - run: npm test
      - run: npm run build
